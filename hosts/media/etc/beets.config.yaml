directory: /music
library: /config/musiclibrary.db

import:
  move: true
  copy: false
  write: true
  autotag: true
  quiet: true
  quiet_fallback: skip
  # Download folders can receive more songs later: never skip a whole directory.
  incremental: false
  resume: false
  duplicate_action: skip
  log: /config/import.log

paths:
  default: $albumartist/$album%aunique{}/$track $title
  singleton: Singles/$artist/$title
  comp: Compilations/$album%aunique{}/$track $title

# MusicBrainz is built into Beets, not a plugin. Avoid scrub: preserve tags
# that are not replaced by the selected metadata match.
plugins: fetchart embedart lastgenre web

fetchart:
  auto: true
  cautious: true

embedart:
  auto: true
  remove_art_file: false

lastgenre:
  auto: true
  source: track

web:
  host: 0.0.0.0
  port: 8337
