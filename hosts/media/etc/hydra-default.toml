# Hydra Torrent Daemon - Configuration
#
# Copié une seule fois vers /config/hydra-qbit/default.toml au premier
# démarrage (voir preStart de podman-hydra) : Hydranos réécrit ce fichier
# lui-même en fonctionnement normal (UI, API), donc Nix ne l'écrase pas
# à chaque déploiement. api_key et password_hash ci-dessous sont des
# placeholders — remplacés à la main sur l'hôte après la première copie
# (régénérables : bouton ↻ de l'UI pour l'api_key, `hydra hash-password
# <password>` pour le hash).

[daemon]
agent_token = ""
api_host = "0.0.0.0"
api_port = 8199
api_key = "REPLACE_ME_API_KEY"
data_dir = "/config"
create_torrent_folder = false

[race]
gluetun_port_forward = false
gluetun_url = ""
gluetun_api_key = ""
webseed_max_concurrent = 48
enable_webseed = true
enable_pex = true
enable_dht = true
start_paused = false
max_dials_per_sec = 0.0
announce_rate_limit = 0.0
enable_ipv6 = false
listen_port = 16171
bind_interface = ""
listen_interfaces = ""
max_connections = 4000
max_uploads_per_torrent = 100
peer_timeout = 300
inactivity_timeout = 20

[race.custom_choking]
enabled = true
tick_interval_seconds = 2
strategy = "rarity_captive"
max_unchoked = 30
rarity_weight = 0.7
speed_weight = 0.3

[hoard]
gluetun_port_forward = false
gluetun_url = ""
gluetun_api_key = ""
webseed_max_concurrent = 48
enable_webseed = true
enable_pex = true
enable_dht = true
start_paused = false
max_dials_per_sec = 0.0
announce_rate_limit = 0.0
enable_ipv6 = false
listen_port = 16172
# bind_interface DOIT rester vide en mode [network] mode = "gluetun" : le
# renseigner (ex: "tun0") fait passer le kill switch d'Hydranos 4.4 en
# BLOCKED (moteur hors réseau, silencieusement) car gluetun gère déjà la
# protection via son propre firewall de netns. Bug vécu le 2026-10-26.
bind_interface = ""
listen_interfaces = ""
max_connections = 2000
max_uploads_per_torrent = -1
peer_timeout = 300
inactivity_timeout = 20

queueing = true
active_seeds = 40
active_limit = 50
active_downloads = 10
dont_count_slow_torrents = true

[vpn_speedtest]
enabled = true
iperf3_server = "ping.online.net"
iperf3_port = 5201
interval_secs = 3600
duration_secs = 10

[race_drain]
reserve_free_gb = 0
add_block_enabled = true
age_ratio_action = "delete"
age_ratio_enabled = false
age_ratio_mode = "and"
min_ratio = 0.0
max_age_hours = 0
enabled = false
check_interval_seconds = 60
high_watermark_pct = 95
low_watermark_pct = 85
race_path = "/race"
min_age_minutes = 10

[auth]
username = "lego"
password_hash = "REPLACE_ME_PASSWORD_HASH"

# [hoard.disk_slots] (mode "HDD quiet" par disque) retiré : code mort en
# Hydranos 4.4, jamais lu par le moteur. La protection du disque passe
# par [hoard] queueing/active_seeds ci-dessus (plafonne les seeds actifs
# en simultané).

[announce_muted]
"gemini-tracker.org" = "1"
"c411.org" = "1"

[network]
mode = "gluetun"
