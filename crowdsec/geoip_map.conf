# Load GeoIP2 Database using real client IP ($realip_remote_addr)
geoip2 /data/goaccess/geoip/GeoLite2-Country.mmdb {
    auto_reload 60m;
    $geoip2_data_country_code source=$realip_remote_addr country iso_code;
}

# GeoIP Country Mapping (Europe + US Allowed)
map $geoip2_data_country_code $allowed_country {
    default 0;
    ""      1;  # Allow internal/LAN traffic (no country code)
    "US"    1;
    "FR"    1;
    "DE"    1;
    "IT"    1;
    "ES"    1;
    "GB"    1;
    "NL"    1;
    "BE"    1;
    "CH"    1;
    "AT"    1;
    "SE"    1;
    "NO"    1;
    "FI"    1;
    "DK"    1;
    "IE"    1;
    "PL"    1;
    "PT"    1;
    "CZ"    1;
    "HU"    1;
    "RO"    1;
    "GR"    1;
    "BG"    1;
    "HR"    1;
    "SK"    1;
    "SI"    1;
    "EE"    1;
    "LV"    1;
    "LT"    1;
    "LU"    1;
    "CY"    1;
    "MT"    1;
    "IS"    1;
    "LI"    1;
}
